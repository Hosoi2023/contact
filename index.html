<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactez-nous</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
    <header class= "hero">
        <img src= "assets/hero.jpg" alt="Image d'une grenouille verte sur une feuille" class = "hero-image">
    </header>

    <main class="contact">

        <!-- contactez nous text -->
        <section class = "card" aria-labelledby="contact-title">
            <h1 id="contact-title" class="card-title">Contactez-nous</h1>
            <p class="card-text">Notre agence vous promet une expertise personnalisée et un accompagnement sur-mesure pour la réalisation de votre site internet et/ou de votre application.</p>

            <form class="form" action="#" method="post">

                <!-- button slide crapaud - grenouille -->
                <fieldset class="toggle">
                    <legend class="visually-hidden">vous êtes</legend>
                    <input type="radio" name="espece" id="crapaud" value="crapaud" checked>
                    <input type="radio" name="espece" id="grenouille" value="grenouille">
                    <span class="toggle-pill" aria-hidden="true"></span>
                    <label for="crapaud" class="toggle-option toggle-option--crapaud">
                        <img src="assets/icon-crapaud.svg" alt="crapaud" width="21.8572" height="20.4005">Crapaud</label>
                    <label for="grenouille" class="toggle-option toggle-option--grenouille">
                        <img src="assets/icon-grenouille.svg" alt="grenouille" width="23" height="21">Grenouille</label>
                </fieldset>

                <!-- formulaire de contacte -->
                <div class="form-grid">
                    <div class="field">
                        <label for="nom">Nom*</label>
                        <input type="text" id="nom" name="nom" autocomplete="family-name" required>
                    </div>
                    <div class="field">
                        <label for="prenom">Prénom*</label>
                        <input type="text" id="prenom" name="prenom" autocomplete="given-name" required>
                    </div>
                    <div class="field field--full">
                        <label for="tel">Numéro de téléphone*</label>
                        <input type="tel" id="tel" name="tel" autocomplete="tel" required>
                    </div>
                    <div class="field field--full">
                        <label for="email">Email*</label>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </div>
                    <div class="field field--full">
                        <label for="adresse">Adresse :</label>
                        <input type="text" id="adresse" name="adresse" autocomplete="street-address">
                    </div>
                    <div class="field">
                        <label for="code-postal">Code Postal :</label>
                        <input type="text" id="code-postal" name="code-postal" autocomplete="postal-code">
                    </div>
                    <div class="field">
                        <label for="ville">Ville :</label>
                        <input type="text" id="ville" name="ville" autocomplete="address-level2">
                    </div>
                </div>

                <!-- consent checkbox -->
                <label class = "consent">
                    <input type="checkbox" name="consent" required>
                    <span class="consent-box"></span>
                    <span class="consent-text">J’accepte que mes données soient recueillies par une famille de crapauds ou de grenouilles aux étangs d’Ixelles.</span>
                </label>

                <button type="submit" class="submit-button">Envoyer</button>
            </form>
        </section>

        <!-- aside info adresse, num telephone, email-->
        <aside class="info">
            <h2 class="info-title">MFM Digital</h2>
            <address class="info-address">
                <p>Rue Middelbourg 66, 1170 Watermael-Boitsfort</p>
                <p><a href="tel:+3228809692">+32 2 880 96 92</a></p>
                <p>info@mfmdigital.com</p>
            </address>
            <ul class="socials">
                <li><a href="#" aria-label="Facebook"><img src="assets/facebook.svg" alt="Facebook logo" width="24" height="24"></a></li>
                <li><a href="#" aria-label="LinkedIn"><img src="assets/linkedin.svg" alt="LinkedIn logo" width="24" height="24"></a></li>
            </ul>
        </aside>
    </main>
    
</body>
</html>
